api_version = "2026-07"

[[extensions]]
name = "t:name"
handle = "wholesale-cart-transformer"
type = "function"
uid = "ae6913cf-5a1c-c417-7e4b-7ae60a2e44c77847e35a"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart_transform_run"

  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/wholesale-cart-transformer.wasm"
  watch = [ "src/**/*.rs" ]

  [extensions.ui.paths]
  create = "/"
  details = "/"
