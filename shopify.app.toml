# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "df06191ac3aad61382ce82af6de1e172"
name = "Wholesale Pricing"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_customers,write_discounts"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[metafields]
api_version = "2026-07"

[discount.metafields.app.tier_tags_map]
type = "json"
name = "Tier Customer Tags Map"

[variant.metafields.app.vip_pricing]
type = "money"
name = "VIP Customer Pricing"

  [variant.metafields.app.vip_pricing.access]
  admin = "merchant_read_write"

[variant.metafields.app.vip_pricing_min]
type = "number_integer"
name = "VIP Customer Pricing Min Quantity"

  [variant.metafields.app.vip_pricing_min.access]
  admin = "merchant_read_write"

[variant.metafields.app.wholesale_pricing]
type = "money"
name = "Wholesale Pricing"

  [variant.metafields.app.wholesale_pricing.access]
  admin = "merchant_read_write"

[variant.metafields.app.wholesale_pricing_min]
type = "number_integer"
name = "Wholesale Pricing Min Quantity"

  [variant.metafields.app.wholesale_pricing_min.access]
  admin = "merchant_read_write"

[variant.metafields.app.b2b_pricing]
type = "money"
name = "B2B Pricing"

  [variant.metafields.app.b2b_pricing.access]
  admin = "merchant_read_write"

[variant.metafields.app.b2b_pricing_min]
type = "number_integer"
name = "B2B Pricing Min Quantity"

  [variant.metafields.app.b2b_pricing_min.access]
  admin = "merchant_read_write"
